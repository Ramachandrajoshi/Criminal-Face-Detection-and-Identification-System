server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Upload size limit ────────────────────────────────────────────────────
    # Must match the 5 MB validation gate in the backend pipeline (AGENTS.md §9).
    # nginx's default is 1 MB; without this directive all image uploads are
    # rejected with 413 Request Entity Too Large before reaching FastAPI.
    client_max_body_size 1G;

    # ── Proxy timeouts for image processing ─────────────────────────────────
    # Face detection + ArcFace embedding can take up to ~1 s per frame on GPU
    # (AGENTS.md §11).  The defaults (60 s) are generous, but we set them
    # explicitly so they are visible and easy to tune.
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    120s;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;

        # Standard proxy headers so FastAPI sees the real client IP / host.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable proxy-level buffering for streaming / large uploads so bytes
        # flow straight through to uvicorn without being spooled to disk twice.
        proxy_request_buffering off;
    }
}
