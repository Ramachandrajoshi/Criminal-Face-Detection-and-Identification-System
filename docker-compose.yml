services:
  db:
    image: pgvector/pgvector:pg15
    container_name: criminal_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-criminaldb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criminal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: criminal_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - criminal_net
    volumes:
      - ./backend:/app
      - /app/__pycache__

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: criminal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - criminal_net

volumes:
  db_data:

networks:
  criminal_net:
    driver: bridge
