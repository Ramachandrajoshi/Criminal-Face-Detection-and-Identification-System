# GPU NOTE ─────────────────────────────────────────────────────────────────
# The backend service requests GPU access via the 'deploy.resources' block.
# For this to work the HOST machine must have:
#   1. NVIDIA GPU drivers installed  (verify: nvidia-smi)
#   2. NVIDIA Container Toolkit      (nvidia-docker2 / nvidia-ctk)
#      Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   3. Docker daemon restarted after toolkit install
# Without the toolkit Docker ignores the GPU reservation silently.
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: criminal_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-criminaldb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criminal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: criminal_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      # Master GPU switch — set ENABLE_GPU=false to force CPU-only mode
      - ENABLE_GPU=${ENABLE_GPU:-true}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      # Prevent TF from grabbing all VRAM on startup
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      # Expose only the second physical GPU (0-indexed) to this container.
      # GPU 0 → first card, GPU 1 → second card.
      # Change to 0 to use the first GPU, or remove to expose all GPUs.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - criminal_net
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./db:/app/db:ro
    # ── GPU resource reservation ─────────────────────────────────────────────
    # Requires NVIDIA Container Toolkit on the host (see top-of-file note).
    #
    # device_ids selects GPUs by their host index (0-based).
    # '1' = second physical GPU (NVIDIA L40S at Bus 00:11.0 in this setup).
    #
    # To switch GPUs:
    #   Second GPU only  → device_ids: ['1']   ← current
    #   First GPU only   → device_ids: ['0']
    #   Both GPUs        → remove device_ids, use: count: all
    #
    # NOTE: count and device_ids are mutually exclusive — never use both.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: criminal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - criminal_net

volumes:
  db_data:

networks:
  criminal_net:
    driver: bridge
