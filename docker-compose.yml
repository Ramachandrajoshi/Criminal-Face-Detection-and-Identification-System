# PROD-SAFE BASE FILE ──────────────────────────────────────────────────────
# This file (plus Dockerfile's default CMD) is the production configuration:
# single uvicorn worker, no --reload, no source bind-mount — the backend runs
# the code baked into the image at build time.
#
# For local development (live source reload), `docker compose up` picks up
# `docker-compose.override.yml` automatically if present in this directory —
# it re-adds --reload and a bind-mount of ./backend. To run the pure prod
# config even with that file present, use:
#   docker compose -f docker-compose.yml up
#
# GPU NOTE ─────────────────────────────────────────────────────────────────
# The backend service requests GPU access via the 'deploy.resources' block.
# For this to work the HOST machine must have:
#   1. NVIDIA GPU drivers installed  (verify: nvidia-smi)
#   2. NVIDIA Container Toolkit      (nvidia-docker2 / nvidia-ctk)
#      Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   3. Docker daemon restarted after toolkit install
# Without the toolkit Docker ignores the GPU reservation silently.
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: criminal_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-criminaldb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - criminal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: criminal_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      # Master GPU switch — set ENABLE_GPU=false to force CPU-only mode
      - ENABLE_GPU=${ENABLE_GPU:-true}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      # Prevent TF from grabbing all VRAM on startup
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      # Expose only the second physical GPU (0-indexed) to this container.
      # GPU 0 → first card, GPU 1 → second card.
      # Change to 0 to use the first GPU, or remove to expose all GPUs.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - criminal_net
    volumes:
      - ./db:/app/db:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: criminal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - criminal_net

volumes:
  db_data:

networks:
  criminal_net:
    driver: bridge
